<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure Data Extractor</title>
<style>
  :root{--bg:#0f1117;--sf:#1a1d27;--sf2:#242836;--bd:#2e3347;--tx:#e4e6f0;--tx2:#8b8fa3;--ac:#6c63ff;--red:#ff6b6b;--grn:#4ecdc4}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;display:flex;flex-direction:column}
  .hdr{padding:12px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-shrink:0}
  .hdr h1{font-size:16px;font-weight:600}
  .hdr span{color:var(--tx2);font-size:12px}
  .main{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0;overflow:hidden}
  .panel{padding:14px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:12px;overflow-y:auto}
  .card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px}
  .card h3{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700}
  .dropzone{border:2px dashed var(--bd);border-radius:8px;padding:20px 12px;text-align:center;cursor:pointer;transition:all .2s}
  .dropzone:hover,.dropzone.drag-over{border-color:var(--ac);background:rgba(108,99,255,.06)}
  .dropzone p{color:var(--tx2);font-size:12px;margin-top:4px}
  .dropzone .icon{font-size:24px}
  .preview-img{max-width:100%;max-height:120px;border-radius:6px;margin-top:8px;object-fit:contain}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;width:100%}
  .btn-p{background:var(--ac);color:#fff}
  .btn-p:hover{background:#5a52e0}
  .btn-p:disabled{opacity:.4;cursor:not-allowed}
  .btn-s{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);flex:1}
  .btn-s:hover{background:var(--bd)}
  .status{padding:8px 10px;border-radius:6px;font-size:11px;line-height:1.4}
  .status.info{background:rgba(108,99,255,.1);color:#9d97ff}
  .status.ok{background:rgba(78,205,196,.1);color:var(--grn)}
  .status.err{background:rgba(255,107,107,.1);color:var(--red)}
  .tbl-wrap{max-height:180px;overflow:auto;border-radius:6px}
  .tbl{width:100%;border-collapse:collapse;font-size:11px}
  .tbl th{position:sticky;top:0;background:var(--sf2);padding:5px 6px;text-align:left;font-weight:600;color:var(--tx2);font-size:10px;text-transform:uppercase}
  .tbl td{padding:4px 6px;border-top:1px solid var(--bd);font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .chart-area{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
  .chart-box{flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:8px;position:relative;min-height:0;overflow:hidden;padding:14px}
  .empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--tx2);font-size:13px;flex-direction:column;gap:6px}
  .empty .big{font-size:36px;opacity:.3}
  .btn-row{display:flex;gap:6px;margin-top:8px}
  .loader{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fi{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px}
  .fi dt{color:var(--tx2)}
  .fi dd{font-weight:600}
  .ctrls{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
  .chip{padding:4px 12px;border-radius:16px;font-size:11px;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);transition:all .15s}
  .chip:hover{border-color:var(--ac)}
  .chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
  #chartCanvas{width:100%!important;height:100%!important}
</style>
</head>
<body>
<div class="hdr">
  <h1>&#128202; Figure Data Extractor</h1>
  <span>Claude Vision &#8226; Upload &#8594; Extract &#8594; Interactive Chart &#8594; Download</span>
</div>
<div class="main">
  <div class="panel">
    <div class="card">
      <h3>Upload</h3>
      <div class="dropzone" id="dz" onclick="document.getElementById('fi').click()">
        <div class="icon">&#128193;</div>
        <p>Drop image or click</p>
        <input type="file" id="fi" accept="image/*" hidden>
      </div>
      <img id="pv" class="preview-img" style="display:none">
      <div id="cf" style="display:none;margin-top:6px;">
        <button class="btn btn-s" onclick="resetUp()" style="width:auto;font-size:11px;padding:4px 10px;">Change</button>
      </div>
    </div>
    <button class="btn btn-p" id="exBtn" disabled onclick="doExtract()">Extract Data</button>
    <div id="st" style="display:none" class="status"></div>
    <div class="card" id="fiCard" style="display:none">
      <h3>Figure Info</h3>
      <dl class="fi" id="fiDl"></dl>
    </div>
    <div class="card" id="dtCard" style="display:none">
      <h3>Data Points</h3>
      <div class="tbl-wrap"><table class="tbl" id="dtTbl"><thead><tr><th>#</th><th>Series</th><th>X</th><th>Y</th></tr></thead><tbody></tbody></table></div>
      <div class="btn-row">
        <button class="btn btn-s" onclick="dlCSV()">CSV</button>
        <button class="btn btn-s" onclick="dlJSON()">JSON</button>
      </div>
    </div>
  </div>
  <div class="chart-area">
    <div class="ctrls" id="ctrls" style="display:none">
      <div class="chip on" data-view="chart" onclick="showView('chart',this)">Interactive Chart</div>
      <div class="chip" data-view="original" onclick="showView('original',this)">Original Image</div>
    </div>
    <div class="chart-box" id="cBox">
      <div class="empty" id="emp"><div class="big">&#128200;</div><div>Upload &amp; extract to see interactive chart</div></div>
      <canvas id="chartCanvas" style="display:none"></canvas>
      <img id="origImg" style="display:none;width:100%;height:100%;object-fit:contain">
    </div>
  </div>
</div>
<!-- Load Chart.js with fallback -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.7/chart.umd.min.js"></script>
<script>
if (typeof Chart === 'undefined') {
  // Fallback CDN
  document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"><\/script>');
}
</script>
<script>
/* =========================================================================
   CLIENT-SIDE CHART RENDERER
   Builds Chart.js charts from extracted data - no reliance on API HTML
   ========================================================================= */

// Dark-theme color palette for series
var SERIES_COLORS = [
  {border:'#e4e6f0', bg:'rgba(228,230,240,0.15)', name:'white'},    // for black originals
  {border:'#ff6b6b', bg:'rgba(255,107,107,0.15)', name:'red'},
  {border:'#4ecdc4', bg:'rgba(78,205,196,0.15)', name:'teal'},
  {border:'#6c63ff', bg:'rgba(108,99,255,0.15)', name:'purple'},
  {border:'#ffd166', bg:'rgba(255,209,102,0.15)', name:'yellow'},
  {border:'#a29bfe', bg:'rgba(162,155,254,0.15)', name:'lavender'},
  {border:'#fd79a8', bg:'rgba(253,121,168,0.15)', name:'pink'},
  {border:'#00cec9', bg:'rgba(0,206,201,0.15)', name:'cyan'}
];

// Map original colors to dark-theme equivalents
var COLOR_MAP = {
  'black':'#e4e6f0','white':'#e4e6f0',
  'red':'#ff6b6b','blue':'#4ecdc4','green':'#4ecdc4',
  'gray':'#8b8fa3','grey':'#8b8fa3',
  'orange':'#ffd166','purple':'#a29bfe'
};

// Map marker names to Chart.js pointStyle
var MARKER_MAP = {
  'circle':'circle','square':'rect','rect':'rect','rectRot':'rectRot',
  'diamond':'rectRot','triangle':'triangle','star':'star','cross':'cross'
};

var chartInstance = null;

function buildChart(data) {
  if (typeof Chart === 'undefined') {
    setSt('err', 'Chart.js failed to load. Check internet connection and refresh.');
    return;
  }

  var canvas = document.getElementById('chartCanvas');
  var ctx = canvas.getContext('2d');

  // Destroy previous chart
  if (chartInstance) {
    chartInstance.destroy();
    chartInstance = null;
  }

  var fi = data.figure_info || {};
  var series = data.series || [];
  var fitCurves = data.fit_curves || [];
  var chartType = fi.chart_type || 'scatter';

  // Determine if this is a line/scatter chart or bar chart
  var isBar = (chartType === 'bar');
  var isLine = (chartType === 'line');
  var isScatterFit = (chartType === 'scatter_with_fit');

  // Build datasets
  var datasets = [];

  // Build error bar lookup per series for the plugin
  var errorBarData = {};

  series.forEach(function(s, i) {
    var color = COLOR_MAP[s.color] || SERIES_COLORS[i % SERIES_COLORS.length].border;
    var bgColor = color.replace(')', ',0.15)').replace('rgb(', 'rgba(');
    if (color.charAt(0) === '#') {
      var r = parseInt(color.slice(1,3),16);
      var g = parseInt(color.slice(3,5),16);
      var b = parseInt(color.slice(5,7),16);
      bgColor = 'rgba('+r+','+g+','+b+',0.15)';
    }

    var points = (s.data_points || []).map(function(p) { return {x: p.x, y: p.y}; });
    // Sort by x for line charts
    points.sort(function(a,b){ return a.x - b.x; });

    var marker = MARKER_MAP[s.marker] || 'circle';
    var showLine = (isLine || s.line_style === 'solid' || s.line_style === 'dashed');

    var ds = {
      label: s.name,
      data: points,
      borderColor: color,
      backgroundColor: bgColor,
      pointStyle: marker,
      pointRadius: 5,
      pointHoverRadius: 8,
      pointBorderColor: color,
      pointBackgroundColor: color,
      showLine: showLine,
      borderWidth: 2,
      fill: false,
      tension: 0.1
    };

    if (s.line_style === 'dashed') {
      ds.borderDash = [6, 3];
    }

    datasets.push(ds);

    // Store error bars
    if (s.error_bars && s.error_bars.length > 0) {
      errorBarData[i] = {};
      s.error_bars.forEach(function(eb) {
        errorBarData[i][eb.x] = {yLow: eb.y_low, yHigh: eb.y_high};
      });
    }
  });

  // Add fit curves
  fitCurves.forEach(function(fc, i) {
    var color = COLOR_MAP[fc.color] || 'rgba(200,200,200,0.6)';
    var points = (fc.points || []).map(function(p) { return {x: p.x, y: p.y}; });
    points.sort(function(a,b){ return a.x - b.x; });

    datasets.push({
      label: fc.name || ('Fit ' + (i+1)),
      data: points,
      borderColor: color,
      backgroundColor: 'transparent',
      pointRadius: 0,
      pointHoverRadius: 3,
      showLine: true,
      borderWidth: 2,
      borderDash: fc.line_style === 'dashed' ? [6, 3] : [],
      fill: false,
      tension: 0.3
    });
  });

  // Error bar plugin
  var errorBarPlugin = {
    id: 'errorBars',
    afterDatasetDraw: function(chart, args) {
      var dsIndex = args.index;
      var ebData = errorBarData[dsIndex];
      if (!ebData) return;

      var ctx = chart.ctx;
      var meta = chart.getDatasetMeta(dsIndex);
      var dataset = chart.data.datasets[dsIndex];
      var color = dataset.borderColor;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.7;

      meta.data.forEach(function(element, idx) {
        var dp = dataset.data[idx];
        if (!dp) return;
        var eb = ebData[dp.x];
        if (!eb) return;

        var x = element.x;
        var yScale = chart.scales.y;
        var yTop = yScale.getPixelForValue(eb.yHigh);
        var yBot = yScale.getPixelForValue(eb.yLow);
        var capW = 3;

        // Vertical line
        ctx.beginPath();
        ctx.moveTo(x, yTop);
        ctx.lineTo(x, yBot);
        ctx.stroke();
        // Top cap
        ctx.beginPath();
        ctx.moveTo(x - capW, yTop);
        ctx.lineTo(x + capW, yTop);
        ctx.stroke();
        // Bottom cap
        ctx.beginPath();
        ctx.moveTo(x - capW, yBot);
        ctx.lineTo(x + capW, yBot);
        ctx.stroke();
      });

      ctx.restore();
    }
  };

  // Axis config
  var xAxis = fi.x_axis || {};
  var yAxis = fi.y_axis || {};

  var xLabel = (xAxis.label || '') + (xAxis.unit ? ' (' + xAxis.unit + ')' : '');
  var yLabel = (yAxis.label || '') + (yAxis.unit ? ' (' + yAxis.unit + ')' : '');

  var xScaleType = xAxis.scale === 'log' ? 'logarithmic' : 'linear';
  var yScaleType = yAxis.scale === 'log' ? 'logarithmic' : 'linear';

  var config = {
    type: isBar ? 'bar' : 'scatter',
    data: { datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 600 },
      interaction: { mode: 'nearest', intersect: false },
      scales: {
        x: {
          type: xScaleType,
          position: 'bottom',
          title: { display: !!xLabel, text: xLabel, color: '#8b8fa3', font: {size: 12} },
          min: xAxis.min,
          max: xAxis.max,
          ticks: { color: '#8b8fa3' },
          grid: { color: 'rgba(139,143,163,0.15)' }
        },
        y: {
          type: yScaleType,
          title: { display: !!yLabel, text: yLabel, color: '#8b8fa3', font: {size: 12} },
          min: yAxis.min,
          max: yAxis.max,
          ticks: { color: '#8b8fa3' },
          grid: { color: 'rgba(139,143,163,0.15)' }
        }
      },
      plugins: {
        legend: {
          labels: {
            color: '#e4e6f0',
            usePointStyle: true,
            padding: 16,
            font: { size: 11 }
          },
          position: 'top'
        },
        tooltip: {
          backgroundColor: '#1a1d27',
          titleColor: '#e4e6f0',
          bodyColor: '#e4e6f0',
          borderColor: '#2e3347',
          borderWidth: 1,
          padding: 10,
          callbacks: {
            label: function(context) {
              var ds = context.dataset;
              var p = context.parsed;
              var label = ds.label + ': (' + p.x + ', ' + p.y + ')';
              // Show error bar info if available
              var dsIdx = context.datasetIndex;
              var ebData2 = errorBarData[dsIdx];
              if (ebData2) {
                var eb = ebData2[context.parsed.x];
                if (eb) {
                  label += ' [' + eb.yLow.toFixed(2) + ' - ' + eb.yHigh.toFixed(2) + ']';
                }
              }
              return label;
            }
          }
        }
      }
    },
    plugins: [errorBarPlugin]
  };

  // For bar charts, restructure data
  if (isBar) {
    // Collect all unique x values as labels
    var allX = [];
    series.forEach(function(s) {
      s.data_points.forEach(function(p) {
        if (allX.indexOf(p.x) === -1) allX.push(p.x);
      });
    });
    allX.sort(function(a,b){ return a-b; });

    config.data.labels = allX.map(String);
    config.data.datasets = series.map(function(s, i) {
      var color = COLOR_MAP[s.color] || SERIES_COLORS[i % SERIES_COLORS.length].border;
      var r = parseInt(color.slice(1,3),16) || 200;
      var g = parseInt(color.slice(3,5),16) || 200;
      var b = parseInt(color.slice(5,7),16) || 200;

      var ptsMap = {};
      s.data_points.forEach(function(p) { ptsMap[p.x] = p.y; });
      return {
        label: s.name,
        data: allX.map(function(x) { return ptsMap[x] || 0; }),
        backgroundColor: 'rgba('+r+','+g+','+b+',0.7)',
        borderColor: color,
        borderWidth: 1
      };
    });
    // Remove x scale type for bar
    config.options.scales.x = {
      title: { display: !!xLabel, text: xLabel, color: '#8b8fa3' },
      ticks: { color: '#8b8fa3' },
      grid: { color: 'rgba(139,143,163,0.15)' }
    };
  }

  canvas.style.display = 'block';
  chartInstance = new Chart(ctx, config);
}


/* =========================================================================
   UPLOAD & EXTRACTION LOGIC (unchanged flow, uses client-side chart)
   ========================================================================= */

var fid=null,data=null,ufn=null;
var dz=document.getElementById('dz');
var fin=document.getElementById('fi');
var pv=document.getElementById('pv');

['dragenter','dragover'].forEach(function(e){dz.addEventListener(e,function(ev){ev.preventDefault();dz.classList.add('drag-over')})});
['dragleave','drop'].forEach(function(e){dz.addEventListener(e,function(ev){ev.preventDefault();dz.classList.remove('drag-over')})});
dz.addEventListener('drop',function(ev){if(ev.dataTransfer.files.length)upFile(ev.dataTransfer.files[0])});
fin.addEventListener('change',function(){if(fin.files.length)upFile(fin.files[0])});

function upFile(f){
  var fd=new FormData();fd.append('file',f);
  setSt('info','Uploading...');
  fetch('/api/upload',{method:'POST',body:fd}).then(function(r){return r.json()}).then(function(d){
    if(d.error){setSt('err',d.error);return}
    fid=d.file_id;ufn=d.filename;
    pv.src='/uploads/'+d.filename;pv.style.display='block';
    dz.style.display='none';document.getElementById('cf').style.display='block';
    document.getElementById('exBtn').disabled=false;
    setSt('ok','Uploaded. Ready to extract.');
  }).catch(function(e){setSt('err',e.message)});
}

function resetUp(){
  fid=null;ufn=null;data=null;
  pv.style.display='none';dz.style.display='block';
  document.getElementById('cf').style.display='none';
  document.getElementById('exBtn').disabled=true;fin.value='';
  // Reset chart area
  document.getElementById('ctrls').style.display='none';
  document.getElementById('emp').style.display='flex';
  document.getElementById('emp').innerHTML='<div class="big">&#128200;</div><div>Upload &amp; extract to see interactive chart</div>';
  document.getElementById('chartCanvas').style.display='none';
  document.getElementById('origImg').style.display='none';
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
}

function doExtract(){
  if(!fid)return;
  var b=document.getElementById('exBtn');
  b.disabled=true;b.innerHTML='<span class="loader"></span> Claude analyzing (30-60s)...';
  setSt('info','Claude extracting data from figure. ~30-60s...');
  fetch('/api/extract/'+fid,{method:'POST'}).then(function(r){return r.json()}).then(function(d){
    if(d.error){setSt('err',d.error);b.disabled=false;b.textContent='Extract Data';return}
    data=d.data||d;
    var series=data.series||[];
    var n=series.reduce(function(s,sr){return s+(sr.data_points||[]).length},0);
    setSt('ok','Extracted '+n+' points across '+series.length+' series. Model: '+(d._model||'opus'));
    b.textContent='Re-Extract';b.disabled=false;
    showInfo(data);
    showTable(data);
    // Build chart client-side from extracted data
    document.getElementById('ctrls').style.display='flex';
    document.getElementById('emp').style.display='none';
    document.getElementById('origImg').style.display='none';
    buildChart(data);
  }).catch(function(e){setSt('err',e.message);b.disabled=false;b.textContent='Extract Data'});
}

function setSt(t,m){var b=document.getElementById('st');b.style.display='block';b.className='status '+t;b.textContent=m}

function showInfo(d){
  document.getElementById('fiCard').style.display='block';
  var f=d.figure_info||{x_axis:{},y_axis:{}};
  var n=(d.series||[]).reduce(function(s,sr){return s+(sr.data_points||[]).length},0);
  var h='';
  h+='<dt>X</dt><dd>'+(f.x_axis.label||'')+(f.x_axis.unit?' ('+f.x_axis.unit+')':'')+'</dd>';
  h+='<dt>Y</dt><dd>'+(f.y_axis.label||'')+(f.y_axis.unit?' ('+f.y_axis.unit+')':'')+'</dd>';
  h+='<dt>X Range</dt><dd>'+(f.x_axis.min||0)+' - '+(f.x_axis.max||0)+'</dd>';
  h+='<dt>Y Range</dt><dd>'+(f.y_axis.min||0)+' - '+(f.y_axis.max||0)+'</dd>';
  if(f.r_squared!=null)h+='<dt>R&#178;</dt><dd>'+f.r_squared+'</dd>';
  if(f.fit_type)h+='<dt>Fit</dt><dd>'+f.fit_type+'</dd>';
  if(f.chart_type)h+='<dt>Type</dt><dd>'+f.chart_type+'</dd>';
  h+='<dt>Series</dt><dd>'+(d.series||[]).length+'</dd>';
  h+='<dt>Points</dt><dd>'+n+'</dd>';
  document.getElementById('fiDl').innerHTML=h;
}

function showTable(d){
  document.getElementById('dtCard').style.display='block';
  var tb=document.querySelector('#dtTbl tbody');var h='',n=0;
  var CL2=['#e4e6f0','#ff6b6b','#4ecdc4','#6c63ff','#ffd166','#a29bfe'];
  (d.series||[]).forEach(function(sr,i){
    var c = COLOR_MAP[sr.color] || CL2[i%CL2.length];
    (sr.data_points||[]).forEach(function(p){
      n++;h+='<tr><td>'+n+'</td><td><span class="dot" style="background:'+c+'"></span>'+sr.name+'</td><td>'+p.x+'</td><td>'+p.y+'</td></tr>';
    });
  });
  tb.innerHTML=h;
}

function showView(v, el){
  document.querySelectorAll('.ctrls .chip').forEach(function(c){c.classList.remove('on')});
  if(el) el.classList.add('on');
  var canvas=document.getElementById('chartCanvas');
  var orig=document.getElementById('origImg');
  if(v==='chart'){
    canvas.style.display='block';
    orig.style.display='none';
    if(data && !chartInstance) buildChart(data);
    if(chartInstance) chartInstance.resize();
  } else {
    canvas.style.display='none';
    orig.src='/uploads/'+ufn;
    orig.style.display='block';
  }
}

function dlCSV(){if(fid)window.open('/api/download/'+fid,'_blank')}
function dlJSON(){if(fid)window.open('/api/download_json/'+fid,'_blank')}
</script>
</body>
</html>
