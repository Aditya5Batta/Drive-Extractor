<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Pipeline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    header { background: #1a1d27; border-bottom: 1px solid #2d3148; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.15rem; font-weight: 600; color: #a78bfa; }
    header span { font-size: 0.78rem; color: #475569; }

    .container { max-width: 1400px; margin: 0 auto; padding: 28px 24px; }

    /* ── Search bar ── */
    .search-card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 24px 28px; margin-bottom: 24px; }
    .search-row { display: flex; gap: 12px; align-items: center; }
    .search-row input[type=text] { flex: 1; background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 11px 16px; font-size: 1rem; color: #e2e8f0; outline: none; transition: border-color 0.2s; }
    .search-row input[type=text]:focus { border-color: #7c3aed; }
    .search-row input[type=text]::placeholder { color: #475569; }
    .run-btn { background: #7c3aed; color: #fff; border: none; border-radius: 8px; padding: 11px 32px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
    .run-btn:hover:not(:disabled) { background: #6d28d9; }
    .run-btn:disabled { background: #3b3f5c; cursor: not-allowed; }

    /* ── Six-panel grid (3×2) ── */
    .panels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    @media (max-width: 1100px) { .panels { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 680px)  { .panels { grid-template-columns: 1fr; } }

    .panel { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; overflow: hidden; }
    .panel-header { padding: 14px 20px; border-bottom: 1px solid #2d3148; display: flex; align-items: center; justify-content: space-between; }
    .panel-header .db-name { font-size: 0.9rem; font-weight: 700; }
    .panel-header .db-name.epmc { color: #60a5fa; }   /* blue   */
    .panel-header .db-name.pmc  { color: #34d399; }   /* green  */
    .panel-header .db-name.ss   { color: #fb923c; }   /* orange */
    .panel-header .db-name.echa { color: #22d3ee; }   /* cyan   */
    .panel-header .db-name.ntp  { color: #fbbf24; }   /* gold   */
    .panel-header .db-name.who  { color: #f472b6; }   /* pink   */
    .panel-header label { font-size: 0.78rem; color: #64748b; display: flex; align-items: center; gap: 8px; }
    .panel-header input[type=number] { background: #0f1117; border: 1px solid #2d3148; border-radius: 6px; padding: 5px 8px; color: #e2e8f0; font-size: 0.85rem; width: 58px; outline: none; }
    .panel-body { padding: 16px 20px; min-height: 120px; }

    .status-bar { font-size: 0.82rem; color: #94a3b8; padding: 8px 12px; background: #0f1117; border-radius: 6px; margin-bottom: 14px; display: none; }

    .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip { border-radius: 8px; padding: 10px 14px; min-width: 90px; background: #0f1117; border: 1px solid #1e293b; }
    .chip .lbl { font-size: 0.65rem; color: #475569; text-transform: uppercase; letter-spacing: .06em; }
    .chip .val { font-size: 1.25rem; font-weight: 700; margin-top: 3px; }
    .chip.green .val { color: #4ade80; }
    .chip.red   .val { color: #f87171; }
    .chip.gray  .val { color: #94a3b8; }

    .section-lbl { font-size: 0.7rem; color: #475569; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
    .paper-card { border: 1px solid #1e293b; border-radius: 8px; padding: 12px 14px; margin-bottom: 7px; display: flex; gap: 12px; align-items: flex-start; background: #0f1117; }
    .paper-card:hover { border-color: #334155; }
    .num { min-width: 26px; height: 26px; border-radius: 6px; background: #052e16; border: 1px solid #166534; color: #4ade80; font-size: 0.72rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .paper-info .title { font-size: 0.88rem; font-weight: 600; color: #e2e8f0; margin-bottom: 4px; line-height: 1.4; word-break: break-word; }
    .paper-info .meta  { font-size: 0.74rem; color: #475569; line-height: 1.6; }
    .paper-info .meta a { color: #818cf8; text-decoration: none; }
    .paper-info .meta a:hover { text-decoration: underline; }
    .paper-info .ids   { font-size: 0.7rem; color: #334155; margin-top: 2px; font-family: monospace; }
    .empty-msg { color: #374151; font-size: 0.82rem; text-align: center; padding: 24px 0; }

    .history-section { margin-top: 28px; }
    .section-title { font-size: 0.72rem; color: #475569; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
    .history-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    @media (max-width: 1100px) { .history-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 680px)  { .history-grid { grid-template-columns: 1fr; } }
    .history-grid h4 { font-size:0.72rem; margin-bottom:8px; font-weight:600; }
    .run-row { background: #1a1d27; border: 1px solid #2d3148; border-radius: 7px; padding: 10px 14px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .run-row:hover { border-color: #7c3aed; }
    .run-row .chem { font-weight: 600; font-size: 0.88rem; }
    .run-row .meta { font-size: 0.73rem; color: #475569; margin-top: 2px; }
    .run-badge { font-size: 0.7rem; padding: 2px 9px; border-radius: 4px; font-weight: 700; }

    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #4b5563; border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>PDF Pipeline</h1>
  <span>EuropePMC · PubMed Central · Semantic Scholar · ECHA · NTP · WHO IPCS — parallel search</span>
</header>

<div class="container">

  <!-- Search bar -->
  <div class="search-card">
    <div class="search-row">
      <input type="text" id="chemical-input" placeholder="Enter chemical name  e.g. Benzene, Toluene, Aspirin, Formaldehyde…" />
      <button class="run-btn" id="run-btn" onclick="runAll()">Run All</button>
    </div>
  </div>

  <!-- Six panels — populated by JS -->
  <div class="panels" id="panels"></div>

  <!-- History — six columns -->
  <div class="history-section">
    <div class="section-title">Recent Runs</div>
    <div class="history-grid" id="history-grid"></div>
  </div>

</div>

<script>
// ── Database registry ────────────────────────────────────────────────────────
// One config row per DB.  Adding a new DB later = add one entry here.
const DBS = [
  { id: "epmc", label: "EuropePMC",        runUrl: "/api/run",      listUrl: "/api/runs",      pdfDir: "/pdfs/europepmc",       color: "#60a5fa" },
  { id: "pmc",  label: "PubMed Central",   runUrl: "/api/pmc/run",  listUrl: "/api/pmc/runs",  pdfDir: "/pdfs/pmc",             color: "#34d399" },
  { id: "ss",   label: "Semantic Scholar", runUrl: "/api/ss/run",   listUrl: "/api/ss/runs",   pdfDir: "/pdfs/semanticscholar", color: "#fb923c" },
  { id: "echa", label: "ECHA",             runUrl: "/api/echa/run", listUrl: "/api/echa/runs", pdfDir: "/pdfs/echa",            color: "#22d3ee" },
  { id: "ntp",  label: "NTP",              runUrl: "/api/ntp/run",  listUrl: "/api/ntp/runs",  pdfDir: "/pdfs/ntp",             color: "#fbbf24" },
  { id: "who",  label: "WHO IPCS",         runUrl: "/api/who/run",  listUrl: "/api/who/runs",  pdfDir: "/pdfs/who_ipcs",        color: "#f472b6" },
];
const dbById = Object.fromEntries(DBS.map(d => [d.id, d]));

// ── Build panels & history columns dynamically ────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  const panels = document.getElementById("panels");
  panels.innerHTML = DBS.map(d => `
    <div class="panel">
      <div class="panel-header">
        <span class="db-name ${d.id}">${d.label}</span>
        <label>PDFs to download
          <input type="number" id="${d.id}-max-pdfs" value="10" min="1" max="25" />
        </label>
      </div>
      <div class="panel-body">
        <div class="status-bar" id="${d.id}-status"></div>
        <div class="chips" id="${d.id}-chips" style="display:none"></div>
        <div id="${d.id}-results"></div>
      </div>
    </div>`).join("");

  const hist = document.getElementById("history-grid");
  hist.innerHTML = DBS.map(d => `
    <div>
      <h4 style="color:${d.color}">${d.label.toUpperCase()}</h4>
      <div id="${d.id}-history"><span class="empty-msg">Loading…</span></div>
    </div>`).join("");

  loadHistory();
  document.getElementById("chemical-input").addEventListener("keydown", e => {
    if (e.key === "Enter") runAll();
  });
});

// ── Fire all DBs in parallel ──────────────────────────────────────────────────
let _pending = 0;
function runAll() {
  const chemical = document.getElementById("chemical-input").value.trim();
  if (!chemical) { alert("Please enter a chemical name."); return; }

  document.getElementById("run-btn").disabled = true;
  _pending = 0;

  for (const d of DBS) {
    const max_pdfs = parseInt(document.getElementById(`${d.id}-max-pdfs`).value) || 10;
    resetPanel(d.id);
    runPanel(d, { chemical, max_pdfs }).finally(checkAllDone);
  }
}

function resetPanel(id) {
  setStatus(id, "running", "Searching…");
  document.getElementById(`${id}-chips`).style.display = "none";
  document.getElementById(`${id}-results`).innerHTML  = "";
  _pending++;
}

function checkAllDone() {
  _pending--;
  if (_pending <= 0) {
    document.getElementById("run-btn").disabled = false;
    _pending = 0;
  }
}

async function runPanel(d, body) {
  try {
    const res  = await fetch(d.runUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    const s    = data.summary || {};

    renderChips(d.id, s);
    renderPapers(d, data.papers || []);
    setStatus(d.id, data.status,
      `Run ${data.run_id} · ${s.pdfs_success ?? 0} saved · ${s.pdfs_failed ?? 0} failed · ${(s.duration_s || 0).toFixed(1)}s`);

    loadHistory();
  } catch (err) {
    setStatus(d.id, "failed", "Error: " + err.message);
  }
}

function setStatus(id, state, msg) {
  const el   = document.getElementById(`${id}-status`);
  const icon = state === "running" ? `<span class="spinner"></span>`
             : state === "success" ? "✅ "
             : state === "failed"  ? "❌ " : "⚠️ ";
  el.innerHTML     = icon + msg;
  el.style.display = "block";
}

function renderChips(id, s) {
  const el = document.getElementById(`${id}-chips`);
  el.style.display = "flex";
  el.innerHTML = `
    <div class="chip green"><div class="lbl">PDFs Saved</div><div class="val">${s.pdfs_success ?? 0}</div></div>
    <div class="chip red">  <div class="lbl">Failed</div>    <div class="val">${s.pdfs_failed  ?? 0}</div></div>
    <div class="chip gray"> <div class="lbl">Duration</div>  <div class="val">${(s.duration_s || 0).toFixed(1)}s</div></div>
  `;
}

function renderPapers(d, papers) {
  const el = document.getElementById(`${d.id}-results`);
  if (!papers.length) {
    el.innerHTML = `<div class="empty-msg">No PDFs found</div>`;
    return;
  }
  el.innerHTML = `<div class="section-lbl">Downloaded PDFs</div>` +
    papers.map((p, i) => {
      const meta  = [p.journal, p.year].filter(Boolean).join(" · ");
      const fname = p.pdf_path ? p.pdf_path.split(/[\\/]/).pop() : null;
      const size  = p.file_size_kb ? ` · ${p.file_size_kb} KB` : "";
      const links = [
        p.epmc_url ? `<a href="${p.epmc_url}" target="_blank">View</a>` : "",
        p.doi      ? `<a href="https://doi.org/${p.doi}" target="_blank">DOI</a>` : "",
        fname      ? `<a href="${d.pdfDir}/${encodeURIComponent(fname)}" target="_blank">⬇ PDF${size}</a>` : "",
      ].filter(Boolean).join("  ·  ");
      const ids = [
        p.pmcid ? p.pmcid : "",
        p.pmid  ? "PMID " + p.pmid : "",
      ].filter(Boolean).join("  ·  ");
      return `<div class="paper-card">
        <div class="num">${i + 1}</div>
        <div class="paper-info">
          <div class="title">${escapeHtml(p.title || "(No title)")}</div>
          ${meta || links ? `<div class="meta">${[meta, links].filter(Boolean).join("  ·  ")}</div>` : ""}
          ${ids ? `<div class="ids">${ids}</div>` : ""}
        </div>
      </div>`;
    }).join("");
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

// ── History — fetch every DB's runs in parallel ──────────────────────────────
async function loadHistory() {
  try {
    const allRuns = await Promise.all(DBS.map(d =>
      fetch(d.listUrl).then(r => r.ok ? r.json() : []).catch(() => [])
    ));
    DBS.forEach((d, i) => renderHistory(`${d.id}-history`, allRuns[i]));
  } catch (_) {}
}

function renderHistory(elId, runs) {
  const el = document.getElementById(elId);
  if (!runs || !runs.length) {
    el.innerHTML = `<span class="empty-msg">No runs yet.</span>`;
    return;
  }
  el.innerHTML = runs.slice(0, 8).map(r => {
    const col = r.status === "success" ? "#4ade80" : r.status === "failed" ? "#f87171" : "#94a3b8";
    const bg  = r.status === "success" ? "#052e16" : r.status === "failed" ? "#2d0a0a" : "#1e293b";
    const dur = r.duration_s ? r.duration_s.toFixed(1) + "s" : "—";
    const dt  = r.started_at ? new Date(r.started_at).toLocaleString() : "";
    return `<div class="run-row">
      <div>
        <div class="chem">${escapeHtml(r.chemical)}</div>
        <div class="meta">${r.run_id} · ${dt} · ${dur} · ${r.pdfs_success ?? 0} PDFs saved</div>
      </div>
      <span class="run-badge" style="background:${bg};color:${col}">${r.status}</span>
    </div>`;
  }).join("");
}
</script>
</body>
</html>
