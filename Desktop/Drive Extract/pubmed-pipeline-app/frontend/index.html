<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Pipeline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    header { background: #1a1d27; border-bottom: 1px solid #2d3148; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.15rem; font-weight: 600; color: #a78bfa; }

    .container { max-width: 1400px; margin: 0 auto; padding: 28px 24px; }

    /* ── Search card ── */
    .search-card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 24px 28px; margin-bottom: 24px; }
    .search-row { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
    .search-row input[type=text] { flex: 1; background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 11px 16px; font-size: 1rem; color: #e2e8f0; outline: none; transition: border-color 0.2s; }
    .search-row input[type=text]:focus { border-color: #7c3aed; }
    .search-row input[type=text]::placeholder { color: #475569; }
    .run-btn { background: #7c3aed; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
    .run-btn:hover:not(:disabled) { background: #6d28d9; }
    .run-btn:disabled { background: #3b3f5c; cursor: not-allowed; }
    .sel-btn { background: transparent; color: #64748b; border: 1px solid #2d3148; border-radius: 8px; padding: 10px 16px; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .sel-btn:hover { color: #e2e8f0; border-color: #475569; }

    /* ── DB selector checkboxes ── */
    .db-selector { display: flex; flex-wrap: wrap; gap: 8px; }
    .db-check { display: flex; align-items: center; gap: 6px; background: #0f1117; border: 1px solid #1e293b; border-radius: 8px; padding: 7px 12px; cursor: pointer; transition: border-color 0.2s; user-select: none; }
    .db-check:hover { border-color: #334155; }
    .db-check.active { border-color: currentColor; }
    .db-check input[type=checkbox] { display: none; }
    .db-check .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: 0.4; transition: opacity 0.2s; }
    .db-check.active .dot { opacity: 1; }
    .db-check .lbl { font-size: 0.8rem; font-weight: 600; }

    /* ── Panels grid ── */
    .panels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    @media (max-width: 1100px) { .panels { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 680px)  { .panels { grid-template-columns: 1fr; } }

    .panel { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; overflow: hidden; }
    .panel.hidden { display: none; }
    .panel-header { padding: 14px 20px; border-bottom: 1px solid #2d3148; display: flex; align-items: center; justify-content: space-between; }
    .panel-header .db-name { font-size: 0.9rem; font-weight: 700; }
    .panel-header .db-name.epmc   { color: #60a5fa; }
    .panel-header .db-name.pmc    { color: #34d399; }
    .panel-header .db-name.ss     { color: #fb923c; }
    .panel-header .db-name.echa   { color: #22d3ee; }
    .panel-header .db-name.ntp    { color: #fbbf24; }
    .panel-header .db-name.who    { color: #f472b6; }
    .panel-header .db-name.oehha  { color: #c084fc; }
    .panel-header .db-name.atsdr  { color: #38bdf8; }
    .panel-header .db-name.zenodo  { color: #a3e635; }
    .panel-header .db-name.canada  { color: #f97316; }
    .panel-header .db-name.concawe { color: #e879f9; }
    .panel-header .db-name.safework { color: #14b8a6; }
    .panel-header .db-name.openalex { color: #f59e0b; }
    .panel-header .db-name.efsa     { color: #06b6d4; }
    .panel-header .db-name.nite     { color: #ef4444; }
    .panel-header .db-name.oecd     { color: #84cc16; }
    .panel-header .db-name.pubmed   { color: #2563eb; }
    .panel-header label { font-size: 0.78rem; color: #64748b; display: flex; align-items: center; gap: 8px; }
    .panel-header input[type=number] { background: #0f1117; border: 1px solid #2d3148; border-radius: 6px; padding: 5px 8px; color: #e2e8f0; font-size: 0.85rem; width: 58px; outline: none; }
    .panel-body { padding: 16px 20px; min-height: 120px; }

    .status-bar { font-size: 0.82rem; color: #94a3b8; padding: 8px 12px; background: #0f1117; border-radius: 6px; margin-bottom: 14px; display: none; }

    .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip { border-radius: 8px; padding: 10px 14px; min-width: 90px; background: #0f1117; border: 1px solid #1e293b; }
    .chip .lbl { font-size: 0.65rem; color: #475569; text-transform: uppercase; letter-spacing: .06em; }
    .chip .val { font-size: 1.25rem; font-weight: 700; margin-top: 3px; }
    .chip.green .val { color: #4ade80; }
    .chip.red   .val { color: #f87171; }
    .chip.gray  .val { color: #94a3b8; }

    .section-lbl { font-size: 0.7rem; color: #475569; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
    .paper-card { border: 1px solid #1e293b; border-radius: 8px; padding: 12px 14px; margin-bottom: 7px; display: flex; gap: 12px; align-items: flex-start; background: #0f1117; }
    .paper-card:hover { border-color: #334155; }
    .num { min-width: 26px; height: 26px; border-radius: 6px; background: #052e16; border: 1px solid #166534; color: #4ade80; font-size: 0.72rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .paper-info .title { font-size: 0.88rem; font-weight: 600; color: #e2e8f0; margin-bottom: 4px; line-height: 1.4; word-break: break-word; }
    .paper-info .meta  { font-size: 0.74rem; color: #475569; line-height: 1.6; }
    .paper-info .meta a { color: #818cf8; text-decoration: none; }
    .paper-info .meta a:hover { text-decoration: underline; }
    .paper-info .ids   { font-size: 0.7rem; color: #334155; margin-top: 2px; font-family: monospace; }
    .empty-msg { color: #374151; font-size: 0.82rem; text-align: center; padding: 24px 0; }

    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #4b5563; border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>PDF Pipeline</h1>
</header>

<div class="container">

  <!-- Search + DB selector card -->
  <div class="search-card">
    <div class="search-row">
      <input type="text" id="chemical-input" placeholder="Enter chemical name  e.g. Benzene, Toluene, Aspirin, Formaldehyde…" />
      <button class="sel-btn" onclick="selectAll()">All</button>
      <button class="sel-btn" onclick="selectNone()">None</button>
      <button class="run-btn" id="run-btn" onclick="runSelected()">Run</button>
    </div>
    <!-- DB checkboxes -->
    <div class="db-selector" id="db-selector"></div>
  </div>

  <!-- Panels — populated by JS, hidden when DB unchecked -->
  <div class="panels" id="panels"></div>

</div>

<script>
const DBS = [
  { id: "epmc",   label: "EuropePMC",        runUrl: "/api/run",        pdfDir: "/pdfs/europepmc",       color: "#60a5fa" },
  { id: "pmc",    label: "PMC Database",     runUrl: "/api/pmc/run",    pdfDir: "/pdfs/pmc",             color: "#34d399" },
  { id: "ss",     label: "Semantic Scholar", runUrl: "/api/ss/run",     pdfDir: "/pdfs/semanticscholar", color: "#fb923c" },
  { id: "echa",   label: "ECHA",             runUrl: "/api/echa/run",   pdfDir: "/pdfs/echa",            color: "#22d3ee" },
  { id: "ntp",    label: "NTP",              runUrl: "/api/ntp/run",    pdfDir: "/pdfs/ntp",             color: "#fbbf24" },
  { id: "who",    label: "WHO IPCS",         runUrl: "/api/who/run",    pdfDir: "/pdfs/who_ipcs",        color: "#f472b6" },
  { id: "oehha",  label: "OEHHA",            runUrl: "/api/oehha/run",  pdfDir: "/pdfs/OEHHA",           color: "#c084fc" },
  { id: "atsdr",  label: "ATSDR",            runUrl: "/api/atsdr/run",  pdfDir: "/pdfs/ATSDR",           color: "#38bdf8" },
  { id: "zenodo", label: "Zenodo",           runUrl: "/api/zenodo/run", pdfDir: "/pdfs/Zenodo",          color: "#a3e635" },
  { id: "canada",  label: "Canada.ca", runUrl: "/api/canada/run",  pdfDir: "/pdfs/Canada_ca", color: "#f97316" },
  { id: "concawe", label: "CONCAWE",   runUrl: "/api/concawe/run", pdfDir: "/pdfs/Concawe",   color: "#e879f9" },
  { id: "safework", label: "Safe Work AU", runUrl: "/api/safework/run", pdfDir: "/pdfs/SafeWork_AU", color: "#14b8a6" },
  { id: "openalex", label: "OpenAlex",     runUrl: "/api/openalex/run", pdfDir: "/pdfs/OpenAlex",    color: "#f59e0b" },
  { id: "efsa",     label: "EFSA",         runUrl: "/api/efsa/run",     pdfDir: "/pdfs/EFSA",        color: "#06b6d4" },
  { id: "nite",     label: "NITE Japan",   runUrl: "/api/nite/run",     pdfDir: "/pdfs/NITE",        color: "#ef4444" },
  { id: "oecd",     label: "OECD eChem",   runUrl: "/api/oecd/run",     pdfDir: "/pdfs/OECD",        color: "#84cc16" },
  { id: "pubmed",   label: "PubMed",       runUrl: "/api/pubmed/run",   pdfDir: "/pdfs/PubMed",      color: "#2563eb" },
  { id: "niosh",    label: "NIOSH",        runUrl: "/api/niosh/run",    pdfDir: "/pdfs/NIOSH",       color: "#dc2626" },
  { id: "ilo",      label: "ILO",          runUrl: "/api/ilo/run",      pdfDir: "/pdfs/ILO",         color: "#0ea5e9" },
];

// Track which DBs are selected (all on by default)
const selected = new Set(DBS.map(d => d.id));

document.addEventListener("DOMContentLoaded", () => {
  // Build DB checkboxes
  const sel = document.getElementById("db-selector");
  sel.innerHTML = DBS.map(d => `
    <div class="db-check active" id="chk-${d.id}" style="color:${d.color}" onclick="toggleDb('${d.id}')">
      <span class="dot"></span>
      <span class="lbl">${d.label}</span>
    </div>`).join("");

  // Build panels
  const panels = document.getElementById("panels");
  panels.innerHTML = DBS.map(d => `
    <div class="panel" id="panel-${d.id}">
      <div class="panel-header">
        <span class="db-name ${d.id}">${d.label}</span>
        <label>PDFs
          <input type="number" id="${d.id}-max-pdfs" value="10" min="1" max="25" />
        </label>
      </div>
      <div class="panel-body">
        <div class="status-bar" id="${d.id}-status"></div>
        <div class="chips" id="${d.id}-chips" style="display:none"></div>
        <div id="${d.id}-results"></div>
      </div>
    </div>`).join("");

  document.getElementById("chemical-input").addEventListener("keydown", e => {
    if (e.key === "Enter") runSelected();
  });
});

function toggleDb(id) {
  const lbl = document.getElementById(`chk-${id}`);
  const panel = document.getElementById(`panel-${id}`);
  if (selected.has(id)) {
    selected.delete(id);
    lbl.classList.remove("active");
    panel.classList.add("hidden");
  } else {
    selected.add(id);
    lbl.classList.add("active");
    panel.classList.remove("hidden");
  }
}

function selectAll() {
  DBS.forEach(d => {
    selected.add(d.id);
    document.getElementById(`chk-${d.id}`).classList.add("active");
    document.getElementById(`panel-${d.id}`).classList.remove("hidden");
  });
}

function selectNone() {
  DBS.forEach(d => {
    selected.delete(d.id);
    document.getElementById(`chk-${d.id}`).classList.remove("active");
    document.getElementById(`panel-${d.id}`).classList.add("hidden");
  });
}

let _pending = 0;

function runSelected() {
  const chemical = document.getElementById("chemical-input").value.trim();
  if (!chemical) { alert("Please enter a chemical name."); return; }
  if (selected.size === 0) { alert("Please select at least one database."); return; }

  document.getElementById("run-btn").disabled = true;
  _pending = 0;

  for (const d of DBS) {
    if (!selected.has(d.id)) continue;
    const max_pdfs = parseInt(document.getElementById(`${d.id}-max-pdfs`).value) || 10;
    resetPanel(d.id);
    runPanel(d, { chemical, max_pdfs }).finally(checkAllDone);
  }
}

function resetPanel(id) {
  setStatus(id, "running", "Searching…");
  document.getElementById(`${id}-chips`).style.display = "none";
  document.getElementById(`${id}-results`).innerHTML = "";
  _pending++;
}

function checkAllDone() {
  _pending--;
  if (_pending <= 0) {
    document.getElementById("run-btn").disabled = false;
    _pending = 0;
  }
}

async function runPanel(d, body) {
  try {
    const res  = await fetch(d.runUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    const s    = data.summary || {};
    renderChips(d.id, s);
    renderPapers(d, data.papers || []);
    setStatus(d.id, data.status,
      `Run ${data.run_id} · ${s.pdfs_success ?? 0} saved · ${s.pdfs_failed ?? 0} failed · ${(s.duration_s || 0).toFixed(1)}s`);
  } catch (err) {
    setStatus(d.id, "failed", "Error: " + err.message);
  }
}

function setStatus(id, state, msg) {
  const el   = document.getElementById(`${id}-status`);
  const icon = state === "running" ? `<span class="spinner"></span>`
             : state === "success" ? "✅ "
             : state === "failed"  ? "❌ " : "⚠️ ";
  el.innerHTML     = icon + msg;
  el.style.display = "block";
}

function renderChips(id, s) {
  const el = document.getElementById(`${id}-chips`);
  el.style.display = "flex";
  el.innerHTML = `
    <div class="chip green"><div class="lbl">PDFs Saved</div><div class="val">${s.pdfs_success ?? 0}</div></div>
    <div class="chip red">  <div class="lbl">Failed</div>    <div class="val">${s.pdfs_failed  ?? 0}</div></div>
    <div class="chip gray"> <div class="lbl">Duration</div>  <div class="val">${(s.duration_s || 0).toFixed(1)}s</div></div>
  `;
}

function renderPapers(d, papers) {
  const el = document.getElementById(`${d.id}-results`);
  if (!papers.length) { el.innerHTML = `<div class="empty-msg">No PDFs found</div>`; return; }
  el.innerHTML = `<div class="section-lbl">Downloaded PDFs</div>` +
    papers.map((p, i) => {
      const meta  = [p.journal, p.year].filter(Boolean).join(" · ");
      const fname = p.pdf_path ? p.pdf_path.split(/[\\/]/).pop() : null;
      const size  = p.file_size_kb ? ` · ${p.file_size_kb} KB` : "";
      const links = [
        p.epmc_url ? `<a href="${p.epmc_url}" target="_blank">View</a>` : "",
        p.doi      ? `<a href="https://doi.org/${p.doi}" target="_blank">DOI</a>` : "",
        fname      ? `<a href="${d.pdfDir}/${encodeURIComponent(fname)}" target="_blank">⬇ PDF${size}</a>` : "",
      ].filter(Boolean).join("  ·  ");
      const ids = [p.pmcid || "", p.pmid ? "PMID " + p.pmid : ""].filter(Boolean).join("  ·  ");
      return `<div class="paper-card">
        <div class="num">${i + 1}</div>
        <div class="paper-info">
          <div class="title">${escapeHtml(p.title || "(No title)")}</div>
          ${meta || links ? `<div class="meta">${[meta, links].filter(Boolean).join("  ·  ")}</div>` : ""}
          ${ids ? `<div class="ids">${ids}</div>` : ""}
        </div>
      </div>`;
    }).join("");
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
</script>
</body>
</html>
